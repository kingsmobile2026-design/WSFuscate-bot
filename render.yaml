services:
  - type: worker
    name: wsfuscate-discord-bot
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
